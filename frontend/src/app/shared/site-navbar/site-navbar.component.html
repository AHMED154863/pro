<header class="site-header">
  <nav class="navbar navbar-expand-lg container" aria-label="Main navigation">
    <a class="navbar-brand brand-mark" routerLink="/home" (click)="closeMenu()">
      <span class="brand-dot" aria-hidden="true"></span>
      Portfolio
    </a>
    <button
      class="navbar-toggler"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation"
      (click)="menuOpen = !menuOpen"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="primary-navigation" class="collapse navbar-collapse" [class.show]="menuOpen">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenu()"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="closeMenu()"
            >About</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/skills" routerLinkActive="active" (click)="closeMenu()"
            >Skills</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/projects" routerLinkActive="active" (click)="closeMenu()"
            >Projects</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/experience"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Experience</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"
            >Contact</a
          >
        </li>
      </ul>
      <a class="btn btn-outline-accent nav-contact" routerLink="/contact" (click)="closeMenu()"
        >Let’s talk</a
      >
    </div>
  </nav>
</header>
